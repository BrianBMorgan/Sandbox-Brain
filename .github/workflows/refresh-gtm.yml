name: Brain Nightly Refresh (Sandbox-GTM)

# Sandbox-GTM is the brain's largest graph. Run inside the all-repos nightly
# sweep, the cumulative memory OOM-kills its analyze worker (a killed worker
# reports "code null"). So it gets its OWN off-peak slot here, isolated, against
# a cold memory baseline — which is exactly when it indexes successfully on its
# own. The main sweep (refresh-cron.yml) excludes it via BRAIN_SKIP. Both
# workflows share the `brain-refresh` concurrency group so a GTM run and the
# main sweep can never run at the same time.
#
# REDUNDANCY: two schedules (02:00 + 14:00 UTC). GitHub silently drops scheduled
# events under load, so the second fire heals a skipped primary run the same day.
# The GTM-only sweep is incremental, so the backup is a cheap no-op when the
# primary ran. 14:00 UTC is clear of the GTM primary (02:00), the main sweep's
# actual landing (~12:00 after GitHub's delay), and the main backup (18:00), so
# the shared brain-refresh concurrency group never has to cancel it.
#
# NOTE: schedule triggers only fire from the default branch (main), so these crons
# go live once this PR merges. Use "Run workflow" (workflow_dispatch) to test
# it immediately after merge.

on:
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC primary (~7pm PT / 10pm ET), well clear of the 08:00 main sweep
    # Backup heals a silently-skipped 02:00 fire (GitHub drops scheduled events under
    # load). GTM-only, incremental, so it is a cheap no-op when the primary already ran;
    # serialized via the brain-refresh concurrency group below.
    - cron: "0 14 * * *"   # 14:00 UTC backup, clear of the GTM primary (02:00), main sweep (~12:00), and main backup (18:00)
  workflow_dispatch: {}

# Shared with the main sweep so the two schedules serialize and never overlap.
concurrency:
  group: brain-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Sandbox-GTM in the brain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run refreshbrain.sh (Sandbox-GTM only)
        env:
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          BRAIN_ONLY: Sandbox-GTM
        run: |
          if [ -z "${BRAIN_API_KEY:-}" ]; then
            echo "::error::BRAIN_API_KEY secret not set on this repo — refresh would 401. Add it in Settings → Secrets."
            exit 1
          fi
          bash scripts/refreshbrain.sh
