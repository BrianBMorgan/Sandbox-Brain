name: Build and push gitnexus-mcp (GHCR)

# Self-hosted, fully-pinned fork. Manual dispatch ONLY — this workflow does NOT
# auto-track upstream (no schedule, no repository_dispatch, no auto version check)
# and does NOT push to Docker Hub. It builds to ghcr.io/brianbmorgan/sandbox-brain.
# Pins live in PINS.md / DockerfileModifier.sh; bumping is a deliberate edit + re-run.

on:
  workflow_dispatch:
    inputs:
      gitnexus_version:
        description: "gitnexus npm version to install (pinned default)"
        required: true
        default: "1.6.5"
      push_latest:
        description: "Also tag and push :latest"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/brianbmorgan/sandbox-brain
  # Fully-pinned build inputs (resolved 2026-06-01 — see PINS.md).
  BASE_IMAGE: "node:22-trixie-slim@sha256:e637ac91fb4f2f40761d217c5d48c41a05edf0b65eb9c34e72c27cce55af9e65"
  HAPROXY_IMAGE: "haproxy:lts@sha256:74735a91316c777de22894a4216729bfee79500caf5ed27dacf92dcd88b22f1c"
  MCP_PROXY_VERSION: "mcp-proxy==0.12.0"

jobs:
  build:
    # Single-arch amd64 only: the Sandbox Brain Render service runs on amd64.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Populate build_data from pinned values
        run: |
          mkdir -p build_data
          printf '%s' "${BASE_IMAGE}"        > build_data/base-image
          printf '%s' "${HAPROXY_IMAGE}"     > build_data/haproxy-image
          printf '%s' "${{ inputs.gitnexus_version }}" > build_data/version
          printf '%s' "${MCP_PROXY_VERSION}" > build_data/mcp_proxy_version
          touch build_data/build
          echo "----- build_data -----"
          for f in base-image haproxy-image version mcp_proxy_version; do
            printf '%s = %s\n' "$f" "$(cat build_data/$f)"
          done

      - name: Generate Dockerfile
        run: |
          bash ./DockerfileModifier.sh
          echo "----- generated FROM / install / clone lines -----"
          grep -nE '^FROM |gitnexus@|mcp-proxy==|serve@|git (init|-c advice|remote add)|GitNexus\.git|checkout ' Dockerfile.gitnexus-mcp

      - name: Build and push (amd64)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.gitnexus-mcp \
            -t ghcr.io/brianbmorgan/sandbox-brain:${{ inputs.gitnexus_version }} \
            ${{ inputs.push_latest && '-t ghcr.io/brianbmorgan/sandbox-brain:latest' || '' }} \
            --push .

      - name: Show pushed image digest
        run: |
          echo "Pushed ${IMAGE}:${{ inputs.gitnexus_version }}"
          docker buildx imagetools inspect ${IMAGE}:${{ inputs.gitnexus_version }}
