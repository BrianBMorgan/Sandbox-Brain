name: Brain Nightly Refresh

# Belt-and-suspenders sweep: re-index every repo in scripts/refreshbrain.sh into
# the shared GitNexus brain on a schedule, so the graph stays fresh even for
# changes that don't come through a repo's per-push brain-refresh workflow
# (and so a wedged on-disk clone gets healed). The per-repo push workflows keep
# things fresh on merge; this is the nightly catch-all + heal.
#
# Sandbox-GTM is the heaviest graph, and a full all-repos sweep peaks the brain's
# RAM and OOM-kills its analyze worker on that repo. So GTM is EXCLUDED here
# (BRAIN_SKIP) and runs on its own off-peak schedule in refresh-gtm.yml. Both
# workflows share the `brain-refresh` concurrency group so they can never overlap.
#
# REDUNDANCY: two schedules (08:00 + 18:00 UTC). GitHub silently drops scheduled
# events under load, so the second fire heals a skipped morning run the same day.
# The sweep is incremental, so the backup is a cheap no-op when the morning ran.
#
# NOTE: schedule triggers only fire from the default branch (main), so these crons
# go live once this PR merges. Use "Run workflow" (workflow_dispatch) to test
# it immediately after merge.

on:
  schedule:
    - cron: "0 8 * * *"    # 08:00 UTC primary (~1am PT / 4am ET); GitHub delay lands it ~11-12:00 UTC
    # Backup heals a silently-skipped 08:00 fire (GitHub drops scheduled events under
    # load). Same non-GTM sweep, incremental, so it is a cheap no-op when the morning
    # run already succeeded; serialized via the brain-refresh concurrency group below.
    - cron: "0 18 * * *"   # 18:00 UTC backup, well clear of the GTM (02:00) and primary (~12:00) slots
  workflow_dispatch: {}

# Never let two refreshes overlap (the brain is memory-bound); let a running one finish.
concurrency:
  group: brain-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh all repos in the brain (except Sandbox-GTM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run refreshbrain.sh
        env:
          BRAIN_API_KEY: ${{ secrets.BRAIN_API_KEY }}
          BRAIN_SKIP: Sandbox-GTM
        run: |
          if [ -z "${BRAIN_API_KEY:-}" ]; then
            echo "::error::BRAIN_API_KEY secret not set on this repo — refresh would 401. Add it in Settings → Secrets."
            exit 1
          fi
          bash scripts/refreshbrain.sh
